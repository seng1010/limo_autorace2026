data_collector_node:
  ros__parameters:
    section_id: 1
    save_dir: '/home/wego/third_impact/src/jetracer_ros2/jetracer_dataset'
    joy_steering_axis: 0
    deadman_button: 3
    max_steer_angle: 0.42
    left_steer_boost: 1.0
    linear_x: 0.25
    save_rate_hz: 10.0
    crop_ratio: 0.0

lane_following_node:
  ros__parameters:
    image_topic: '/camera/color/image_raw/compressed'
    camera_info_topic: '/camera/color/camera_info'
    output_topic: 'inference/cmd_vel'
    mode_topic: 'mission/lane_mode'
    use_camera_info: true
    publish_debug: true
    command_timeout_sec: 0.30
    minimum_confidence: 0.48
    normal_speed: 0.25
    zigzag_speed: 0.12
    lateral_gain: 0.95
    heading_gain: 0.70
    max_steer_angle: 0.42
    heading_hold_decay: 0.98
    invalid_hold_sec: 0.25            # 차선 놓쳤을 때 마지막 명령 유지 시간 [s]
    reset_after_invalid_frames: 5     # 연속 N프레임 실패 시 이전 차선 기준 초기화
    zigzag_enter_frames: 3
    zigzag_exit_frames: 5
    image_width: 640
    image_height: 480
    bev_src: [0.30, 0.52, 0.70, 0.52, 0.94, 0.92, 0.06, 0.92]
    bev_dst: [0.22, 0.00, 0.78, 0.00, 0.78, 1.00, 0.22, 1.00]
    detect_white: false               # 트랙 차선이 노란색이라 흰색 검출 끔
    white_lightness_min: 170
    white_saturation_max: 100
    detect_yellow: true               # 노란 차선 검출
    yellow_hue_min: 15                # HLS hue (0~180)
    yellow_hue_max: 35
    yellow_saturation_min: 80
    yellow_lightness_min: 60
    gradient_min: 35
    morphology_kernel: 3
    windows: 10
    window_margin: 55
    recenter_min_pixels: 35
    fit_min_points: 120
    polynomial_degree: 3
    ransac_iterations: 60
    ransac_residual_px: 7.0
    lane_width_px: 360.0
    lane_width_tolerance: 0.35
    max_lane_width_change_px: 70.0
    max_fit_jump_px: 90.0
    lookahead_y_ratio: 0.62
    smoothing_alpha: 0.35
    zigzag_min_step_px: 8.0
    zigzag_min_span_px: 55.0
    zigzag_min_direction_changes: 1

stop_line_node:
  ros__parameters:
    image_topic: '/camera/color/image_raw/compressed'
    odom_topic: '/odom'
    roi_top_ratio: 0.58
    # 정지선 색: 흰색 (트랙 확인). 옆 차선은 노란색이라 흰색만 검출해야 차선이 안 섞임
    detect_white: true
    white_lightness_min: 180
    white_saturation_max: 90
    detect_yellow: false
    yellow_hue_min: 15                # HLS hue (0~180)
    yellow_hue_max: 35
    yellow_saturation_min: 80
    yellow_lightness_min: 60
    horizontal_kernel_ratio: 0.12
    minimum_width_ratio: 0.42
    minimum_area_ratio: 0.018
    # 발행 거리 = 판정 기준 바퀴 -> 정지선 가까운 쪽 가장자리 [m]
    # 정지선 앞에 서야 하므로 앞바퀴 기준 (앞바퀴가 정지선을 넘으면 안 됨).
    # 규정집 v3 III-아 '뒷바퀴'는 진입·통과·시간 카운트 판정으로 해석 (팀 결정 11/13)
    reference_wheel: 'front'          # 'front' | 'rear'(정지선 위치까지 뒷바퀴 기준일 때)
    wheelbase_m: 0.20                 # 앞-뒤 바퀴 축 거리 (LIMO 사양 200 mm, 실측 권장)
    # 보정표: scripts/calibrate_stop_line.py 결과를 붙여넣기 (소수점 꼭 포함)
    # 보정표 자체는 **앞바퀴 기준**, rear 이면 wheelbase_m 를 더해서 발행
    # 2개 미만이면 보정 전 -> 아래 distance_scale_m 선형식 사용 (예전과 동일, offset 없음)
    # 2026-11-13 실차 보정: scripts/calibrate_stop_line.py, odom bag 3개 (이동 0.97~1.00 m)
    #   bag 간 오차 ±2 cm. 보이는 범위: 앞바퀴 기준 약 0.26 ~ 0.53 m, 0.26 m 안쪽은 카메라 사각지대
    lut_rows: [0.6583, 0.6865, 0.7188, 0.7479, 0.8052, 0.8594, 0.9292, 0.9833]
    lut_distances_m: [0.5257, 0.4795, 0.4506, 0.4187, 0.3765, 0.3396, 0.3039, 0.2679]
    distance_scale_m: 1.6
    # 사각지대: 선이 화면에서 사라지면 /odom 이동거리로 남은 거리 계속 추정
    use_odom_tracking: true
    blind_track_max_m: 0.8            # 이 거리(기준 바퀴) 안에서 놓친 선만 추적. rear로 바꿔도 되게 0.8
    blind_pass_margin_m: 0.10         # 선을 이만큼 지나치면 추적 종료 -> -1.0
    blind_jump_tolerance_m: 0.15      # 추적 중 이보다 먼 선이 보이면 다른 선으로 보고 무시
    publish_debug: true

yolo_detection_node:
  ros__parameters:
    image_topic: '/camera/color/image_raw/compressed'
    model_path: ''  # e.g. /home/wego/models/autorace.engine
    confidence: 0.45
    iou: 0.5
    image_size: 640
    max_rate_hz: 10.0
    confirm_frames: 3
    publish_debug: true
    traffic_roi: [0.0, 0.0, 1.0, 0.65]
    advertisement_exclusion_roi: [0.0, 0.65, 1.0, 1.0]

mission_manager_node:
  ros__parameters:
    lane_command_topic: 'inference/cmd_vel'
    cone_command_topic: 'mission/cone/cmd_vel'
    parking_command_topic: 'mission/parking/cmd_vel'
    output_topic: '/cmd_vel'
    mission_event_topic: 'mission/event'
    active_mission_topic: 'mission/active'
    lane_mode_topic: 'mission/lane_mode'
    normal_speed: 0.25
    slow_speed: 0.12
    command_timeout_sec: 0.40
    auto_start_mission_nodes: true
    start_mission: 'M5'               # 테스트: --ros-args -p start_mission:=M3
    odom_topic: '/odom'
    odom_timeout_sec: 0.5
    stop_line_timeout_sec: 0.5
    # 정지선 감속·정밀 정지 (M1·M3 공용). 거리 = 앞바퀴 -> 정지선 (stop_line_node reference_wheel)
    approach_start_m: 0.50            # 이 거리 안에서부터 감속
    approach_gain: 0.8                # 속도 = gain * 남은거리 [1/s]
    approach_creep_speed: 0.06        # 마지막 접근 최저 속도 [m/s]
    approach_stop_offset_m: 0.01      # 제동거리 보정: 정지 후 선을 평균 이만큼 넘으면 그만큼 키우기
    full_stop_speed: 0.01             # odom |v| 이하이면 정지로 봄 [m/s]
    full_stop_sec: 0.3                # 그 상태가 이만큼 유지되면 '완전정지' 확인
    # M3 보행자 표지판 정지
    m3_trigger: 'sign'                # 대회용: 표지판 본 뒤 정지선에서만 정지
                                      # YOLO 없이 테스트: --ros-args -p m3_trigger:=sign_or_line
    m3_line_arm_distance_m: 0.80      # 정지선이 이 거리 안이면 감속·정지 시작
    m3_sign_valid_distance_m: 1.5     # 표지판 본 뒤 이 거리 안에 나온 정지선만 인정
    m3_max_approach_distance_m: 1.5   # M3 시작 후 못 서고 이만큼 가면 M3 건너뜀 (0 = 끄기)
                                      # = M3 시작 지점(M6 끝)~횡단보도 정지선 거리 + 0.5 m. 트랙에서 재서 조정
    # M1 신호등 (m1_traffic_light.py). 신호 색은 mission_traffic_light_node 가 판단
    m1_trigger: 'light'               # 대회용: 신호등 본 뒤 정지선에서 판단
                                      # YOLO 없이 테스트: --ros-args -p m1_trigger:=light_or_line
    m1_line_arm_distance_m: 0.80      # 정지선이 이 거리 안이면 정지/통과 판단
    m1_light_valid_distance_m: 2.0    # 신호등 본 뒤 이 거리 안의 정지선만 인정
    m1_stop_on_green_arrival: false   # true: 녹색에 도착해도 일단 정지 후 출발
    m1_stop_switch_min_m: 0.15        # 녹색 통과 중 적·황으로 바뀌면 이 거리 이상 남았을 때만 정지
    m1_max_wait_sec: 30.0             # 녹색 안 보이면 이 시간 뒤 출발 (나머지 미션 보호, 0 = 끄기)
    m1_done_distance_m: 0.50          # 출발/통과 후 이만큼 가면 M1 완료 -> M4
    m1_max_approach_distance_m: 2.0   # M1 시작 후 판단 못 하고 이만큼 가면 M1 건너뜀 (트랙 보고 조정)
    m3_hold_sec: 3.5                  # 완전정지 확인 후 대기 (규정 3초 이상)
    m3_done_distance_m: 0.50          # 출발 후 이만큼 가면 M3 완료 -> M7

mission_traffic_light_node:
  ros__parameters:
    # 신호 색만 판단 (정지·출발은 매니저). traffic_light_logic.py
    detections_topic: 'perception/detections'   # YOLO 모든 박스 (최고점 1개만 나오는 yolo_event 아님)
    image_topic: '/camera/color/image_raw/compressed'
    output_topic: 'mission/traffic_light_state' # red / yellow / green / unknown
    publish_rate_hz: 10.0
    image_max_age_sec: 0.3
    min_confidence: 0.45
    min_area_ratio: 0.0005            # 박스 면적/화면. 너무 작은(먼) 신호등 무시
    verify_hsv: true                  # 박스 안 불빛 색을 HSV로 다시 확인 (광고 모니터·오분류 거르기)
    min_lit_ratio: 0.04               # 박스 안 그 색 불빛 픽셀 비율 최소
    lit_value_min: 150
    lit_saturation_min: 90
    confirm_frames: 3                 # 같은 색 연속 N번이면 확정
    lost_timeout_sec: 1.0             # 신호등이 이 시간 안 보이면 unknown

mission_obstacle_avoid_node:
  ros__parameters:
    scan_topic: '/scan'
    front_angle_deg: 24.0
    side_angle_min_deg: 20.0
    side_angle_max_deg: 75.0
    obstacle_distance_m: 1.15
    clearance_distance_m: 1.4
    minimum_points: 4
    confirm_scans: 3

mission_cone_avoid_node:
  ros__parameters:
    scan_topic: '/scan'
    output_topic: 'mission/cone/cmd_vel'
    speed: 0.10
    max_steer_angle: 0.42
    lookahead_m: 1.0
    field_of_view_deg: 80.0
    maximum_cone_range_m: 2.5
    minimum_points_each_side: 2
    steering_gain: 1.3
    emergency_distance_m: 0.25

mission_parking_node:
  ros__parameters:
    output_topic: 'mission/parking/cmd_vel'
    search_speed: 0.08
    reverse_speed: -0.07
    max_steer_angle: 0.40
    opening_distance_m: 1.0
    opening_confirm_scans: 4
    advance_distance_m: 0.42
    reverse_turn_yaw_deg: 72.0
    reverse_straight_distance_m: 0.48
    rear_stop_distance_m: 0.22
    right_sector_deg: [-100.0, -55.0]

debug_autorace_node:
  ros__parameters:
    frame_id: 'base_link'
