data_collector_node:
  ros__parameters:
    section_id: 1
    save_dir: '/home/wego/third_impact/src/jetracer_ros2/jetracer_dataset'
    joy_steering_axis: 0
    deadman_button: 3
    max_steer_angle: 0.42
    left_steer_boost: 1.0
    linear_x: 0.25
    save_rate_hz: 10.0
    crop_ratio: 0.0

lane_following_node:
  ros__parameters:
    image_topic: '/camera/color/image_raw/compressed'
    camera_info_topic: '/camera/color/camera_info'
    output_topic: 'inference/cmd_vel'
    mode_topic: 'mission/lane_mode'
    use_camera_info: true
    publish_debug: true
    command_timeout_sec: 0.30
    minimum_confidence: 0.48
    normal_speed: 0.25
    zigzag_speed: 0.12
    lateral_gain: 0.95
    heading_gain: 0.70
    max_steer_angle: 0.42
    heading_hold_decay: 0.98
    invalid_hold_sec: 0.25            # 차선 놓쳤을 때 마지막 명령 유지 시간 [s]
    reset_after_invalid_frames: 5     # 연속 N프레임 실패 시 이전 차선 기준 초기화
    zigzag_enter_frames: 3
    zigzag_exit_frames: 5
    image_width: 640
    image_height: 480
    bev_src: [0.30, 0.52, 0.70, 0.52, 0.94, 0.92, 0.06, 0.92]
    bev_dst: [0.22, 0.00, 0.78, 0.00, 0.78, 1.00, 0.22, 1.00]
    detect_white: false               # 트랙 차선이 노란색이라 흰색 검출 끔
    white_lightness_min: 170
    white_saturation_max: 100
    detect_yellow: true               # 노란 차선 검출
    yellow_hue_min: 15                # HLS hue (0~180)
    yellow_hue_max: 35
    yellow_saturation_min: 80
    yellow_lightness_min: 60
    gradient_min: 35
    morphology_kernel: 3
    windows: 10
    window_margin: 55
    recenter_min_pixels: 35
    fit_min_points: 120
    polynomial_degree: 3
    ransac_iterations: 60
    ransac_residual_px: 7.0
    lane_width_px: 360.0
    lane_width_tolerance: 0.35
    max_lane_width_change_px: 70.0
    max_fit_jump_px: 90.0
    lookahead_y_ratio: 0.62
    smoothing_alpha: 0.35
    zigzag_min_step_px: 8.0
    zigzag_min_span_px: 55.0
    zigzag_min_direction_changes: 1

stop_line_node:
  ros__parameters:
    image_topic: '/camera/color/image_raw/compressed'
    odom_topic: '/odom'
    roi_top_ratio: 0.58
    # 정지선 색: 흰색 (트랙 확인). 옆 차선은 노란색이라 흰색만 검출해야 차선이 안 섞임
    detect_white: true
    white_lightness_min: 145          
    white_saturation_max: 90
    detect_yellow: false
    yellow_hue_min: 15                # HLS hue (0~180)
    yellow_hue_max: 35
    yellow_saturation_min: 80
    yellow_lightness_min: 60
    horizontal_kernel_ratio: 0.12
    minimum_width_ratio: 0.42
    minimum_area_ratio: 0.018
    # 발행 거리 = 판정 기준 바퀴 -> 정지선 가까운 쪽 가장자리 [m]
    # 정지선 앞에 서야 하므로 앞바퀴 기준 (앞바퀴가 정지선을 넘으면 안 됨).
    # 규정집 v3 III-아 '뒷바퀴'는 진입·통과·시간 카운트 판정으로 해석 (팀 결정 11/13)
    reference_wheel: 'front'          # 'front' | 'rear'(정지선 위치까지 뒷바퀴 기준일 때)
    wheelbase_m: 0.20                 # 앞-뒤 바퀴 축 거리 (LIMO 사양 200 mm, 실측 권장)
    # 보정표: scripts/calibrate_stop_line.py 결과를 붙여넣기 (소수점 꼭 포함)
    # 보정표 자체는 **앞바퀴 기준**, rear 이면 wheelbase_m 를 더해서 발행
    # 2개 미만이면 보정 전 -> 아래 distance_scale_m 선형식 사용 (예전과 동일, offset 없음)
    # 2026-11-13 실차 보정: scripts/calibrate_stop_line.py, odom bag 3개 (이동 0.97~1.00 m)
    #   bag 간 오차 ±2 cm. 보이는 범위: 앞바퀴 기준 약 0.26 ~ 0.53 m, 0.26 m 안쪽은 카메라 사각지대
    lut_rows: [0.6583, 0.6865, 0.7188, 0.7479, 0.8052, 0.8594, 0.9292, 0.9833]
    lut_distances_m: [0.5257, 0.4795, 0.4506, 0.4187, 0.3765, 0.3396, 0.3039, 0.2679]
    distance_scale_m: 1.6
    # 사각지대: 선이 화면에서 사라지면 /odom 이동거리로 남은 거리 계속 추정
    use_odom_tracking: true
    blind_track_max_m: 0.8            # 이 거리(기준 바퀴) 안에서 놓친 선만 추적. rear로 바꿔도 되게 0.8
    blind_pass_margin_m: 0.10         # 선을 이만큼 지나치면 추적 종료 -> -1.0
    blind_jump_tolerance_m: 0.15      # 추적 중 이보다 먼 선이 보이면 다른 선으로 보고 무시
    publish_debug: true

yolo_detection_node:
  ros__parameters:
    image_topic: '/camera/color/image_raw/compressed'
    model_path: '/home/wego/models/autorace_all.pt'   # 통합 YOLO 모델 (LIMO 에 이 경로로 파일을 넣을 것). 비우면 YOLO 없이 동작
    confidence: 0.45
    iou: 0.5
    image_size: 640
    max_rate_hz: 10.0
    confirm_frames: 3
    publish_debug: true
    traffic_roi: [0.0, 0.0, 1.0, 0.65]
    advertisement_exclusion_roi: [0.0, 0.65, 1.0, 1.0]

section_node:
  ros__parameters:
    # 구간 전환 (section_logic.py). 거리 = 그 미션이 시작된 뒤 간 거리 [m], 음수 = 끄기
    #   line_after : 이 거리 뒤에 나오는 첫 정지선에 앞바퀴가 닿으면 다음 미션
    #   timeout    : 정지선을 못 봐도 이 거리에서 다음 미션 (정지선을 안 쓰는 미션은 이 값만)
    #   slow_from~slow_to : 서행 구간. 미션이 넘어가도 slow_to 까지 유지
    # 11/15 02:31 실차 1회 기록 (출발선 기준 누적): 서행 표시 선 1.52 / 지그재그 앞 선 9.31 /
    #   횡단보도 정지선 11.27 / 그다음 선 13.45 m. 아래 값은 이 기록에 맞춘 것 (1회라 여유를 둠)
    odom_topic: '/odom'
    slow_speed: 0.15                  # 서행 속도 [m/s] (규정: 기본 속도의 1/2 수준, 최대 0.2 이하. 기본 0.30 의 절반)
    line_min_frames: 2
    line_refractory_m: 0.30
    # M5 서행(방지턱): 출발선 -> 첫 코너 지나 지그재그 앞 정지선
    m5_line_after_m: 8.6              # 지그재그 앞 선(9.31) - 0.7
    m5_timeout_m: 9.6                 # 그 선을 놓쳤을 때
    m5_slow_line_after_m: 0.8         # 출발 후 0.8 m 뒤 처음 보이는 선(서행 표시 선, 1.52 m)에서 서행 시작
    m5_slow_from_m: 1.7               # 그 선을 놓쳤을 때 서행 시작
    m5_slow_to_m: 5.0                 # 서행 끝 (출발선 기준). 대회장에서 방지턱 끝 + 여유로 조정
    # M6 서행 유도선(지그재그): 횡단보도 정지선이 0.8 m 안에 들어오기 전에 M3 로 넘겨야 함
    m6_line_after_m: -1.0
    m6_timeout_m: 1.0
    m6_slow_from_m: 0.0
    m6_slow_line_after_m: -1.0
    m6_slow_to_m: 2.0                 # 횡단보도 정지선(M6 시작 후 1.96 m)까지 서행 유지
    # M2 갈림길, M8 라바콘: 3차선 미션을 붙인 뒤 설정 (지금은 꺼 둠)
    m2_line_after_m: -1.0
    m2_timeout_m: -1.0
    m2_slow_from_m: -1.0
    m2_slow_to_m: -1.0
    m2_slow_line_after_m: -1.0
    m8_line_after_m: -1.0
    m8_timeout_m: -1.0
    m8_slow_from_m: -1.0
    m8_slow_to_m: -1.0
    m8_slow_line_after_m: -1.0

mission_manager_node:
  ros__parameters:
    lane_command_topic: 'inference/cmd_vel'
    cone_command_topic: 'mission/cone/cmd_vel'
    parking_command_topic: 'mission/parking/cmd_vel'
    output_topic: '/cmd_vel'
    mission_event_topic: 'mission/event'
    active_mission_topic: 'mission/active'
    lane_mode_topic: 'mission/lane_mode'
    normal_speed: 0.30                # 평소 속도 상한 (11/14 코너 검증 때와 같은 0.30)
    slow_speed: 0.12
    command_timeout_sec: 0.40
    auto_start_mission_nodes: true
    start_mission: 'M5'               # 테스트: --ros-args -p start_mission:=M3
    odom_topic: '/odom'
    odom_timeout_sec: 0.5
    stop_line_timeout_sec: 0.5
    traffic_state_timeout_sec: 0.5   # 신호등 상태 발행 중단 시 마지막 녹색을 계속 재사용하지 않음
    # 정지선 감속·정밀 정지 (M1·M3 공용). 거리 = 앞바퀴 -> 정지선 (stop_line_node reference_wheel)
    approach_start_m: 0.50            # 이 거리 안에서부터 감속
    approach_gain: 0.8                # 속도 = gain * 남은거리 [1/s]
    approach_creep_speed: 0.06        # 마지막 접근 최저 속도 [m/s]
    approach_stop_offset_m: 0.01      # 제동거리 보정: 정지 후 선을 평균 이만큼 넘으면 그만큼 키우기
                                      # (M1·M3 공용 기본값. 아래에서 미션별로 따로 줄 수 있음)
    full_stop_speed: 0.01             # odom |v| 이하이면 정지로 봄 [m/s]
    full_stop_sec: 0.3                # 그 상태가 이만큼 유지되면 '완전정지' 확인
    # M3 보행자 표지판 정지
    m3_trigger: 'sign_or_line'        # 표지판을 못 봐도 정지선에서 정지 (YOLO 모델이 없거나 놓쳐도 섬)
                                      # section_node 가 횡단보도 직전에만 M3 를 켜므로 다른 흰 선에 설 위험이 작다
                                      # 표지판 본 뒤에만 서게 하려면 'sign'
    m3_line_arm_distance_m: 0.80      # 정지선이 이 거리 안이면 감속·정지 시작
    m3_sign_valid_distance_m: 1.5     # 표지판 본 뒤 이 거리 안에 나온 정지선만 인정
    m3_max_approach_distance_m: 2.2   # M3 시작 후 못 서고 이만큼 가면 M3 건너뜀 (0 = 끄기)
                                      # 11/15 실차: M3 시작 -> 정지선 0.93 m. M5 가 일찍 끝나는 경우까지 덮게 2.2
                                      # = M3 시작 지점(M6 끝)~횡단보도 정지선 거리 + 0.5 m. 트랙에서 재서 조정
    # M1 신호등 (m1_traffic_light.py). 신호 색은 mission_traffic_light_node 가 판단
    m1_trigger: 'light_or_line'       # 첫 선은 서행, 두 번째 선은 신호가 안 보여도 정지 후 판단
    m1_line_arm_distance_m: 0.80      # 정지선이 이 거리 안이면 정지/통과 판단
    m1_light_valid_distance_m: 2.0    # 신호등 본 뒤 이 거리 안의 정지선만 인정
    m1_stop_on_green_arrival: true    # 녹색이어도 odom 완전정지 확인 후 신선한 녹색으로 출발
    m1_stop_switch_min_m: 0.15        # 녹색 통과 중 적·황으로 바뀌면 이 거리 이상 남았을 때만 정지
    m1_max_wait_sec: 0.0              # 녹색 없이 시간만으로 출발하는 우회 비활성. 양수는 명시적 시험용
    m1_done_distance_m: 0.50          # 출발 후 M4 접근으로 전환. 횡단보도 끝선은 아래 설정으로 제외
    m1_max_approach_distance_m: 0.0   # 호환용. 매니저는 양수를 지정해도 거리만으로 M1을 완료하지 않음
    m1_skip_lines: 1                  # M1 구간 앞쪽 정지선 무시 개수.
                                      # 경기장은 횡단보도 앞에 '천천히' 시작선이 하나 있어 1.
                                      # 천천히 선이 없는 배치면 0
    m1_lost_line_revert_m: 0.30       # 정지 전에 이보다 멀리서 선을 놓치면 잘못 본 선 -> 계속 주행
    m1_stop_offset_m: 0.03            # 정지선 **앞 3cm** 에 정지. 선에 딱 붙으면 신호등이
                                      # 카메라 화각을 벗어나 안 보인다 (규정 ±5cm 안)
    # 경기장 M1 에는 '천천히' 노면 표시가 있으나 서행 표지판이 없어 YOLO 로 못 잡는다.
    # 그래서 정지선을 slow_after_lines 개 지나면 서행을 시작한다 (음수 = 서행 안 함)
    m1_slow_speed: 0.15
    m1_slow_after_lines: 1
    m3_hold_sec: 3.5                  # 완전정지 확인 후 대기 (규정 3초 이상)
    m3_done_distance_m: 0.50          # 출발 후 이만큼 가면 M3 완료 -> M7
    m3_lost_line_revert_m: 0.30       # 정지 전에 이보다 멀리서 선을 놓치면 잘못 본 선 -> 계속 주행
    m3_stop_offset_m: -1.0            # 정지선 앞 몇 m 에 설지 (음수 = approach_stop_offset_m 사용)
    # M4 접근은 차선 조향 유지. 정지 확인 후 parking_line_detection의 기존 시간제 시퀀스에 인계.
    m4_line_arm_distance_m: 0.80
    m4_stop_offset_m: 0.01            # 앞바퀴 축 -> 정지선, M3 공용값과 동일한 초기값. 실차 정지 위치 확인 필요
    m4_full_stop_sec: 0.5             # odom 정지가 연속 0.5초 확인된 뒤 주차 시작 허가
    m4_skip_crosswalk_end: true       # M1 출발 후 첫 새 선(횡단보도 끝)은 통과, 다음 선에서 주차 준비
    # 전체 주행에서도 M2에서 M8 단독 launch와 같은 입구 감시를 사용한다.
    # M2 진입 즉시 콘 제어로 바꾸지 않음: 55cm 사전검사, 45cm/전방 위험 시 보호접근.
    m8_entry_arm_after_m: -1.0
    m8_entry_arm_near_line_m: 0.45
    m8_entry_precheck_m: 0.55
    # M8 강제 탈출 (출구 선·출구 차선 확인이 끝내 안 될 때 M1 로 넘김). 0 이하 = 끔
    #   거리 = M8 에 들어온 뒤 odom 이동거리. 콘 명령이 0 이면 매니저가 정지시키므로 차가 서면 거리는 안 는다
    #   -> 거리 조건(idle, max) + 서 있을 때 조건(stuck) + 시간 조건(timeout) 을 같이 둔다
    #   도면 기준 콘 구간(입구 선~출구 선) 직선 약 2.1 m, M8 진입은 입구 선 앞 최대 0.45 m. 실차 로그로 조정
    m8_force_exit_after_m: 2.0        # [idle] 이 거리 이상 갔고 (출구 선 직전. 도면상 입구~출구 직선 약 2.1 m)
    m8_force_exit_idle_sec: 1.0       #        콘 노드가 이 시간 동안 v>0 명령을 안 내면 M1
    m8_force_exit_max_m: 4.0          # [max] 콘 명령과 무관하게 이 거리를 넘으면 M1
    m8_force_exit_stuck_min_m: 1.5    # [stuck] 콘 구간 절반 이상 들어왔고
    m8_force_exit_stuck_sec: 3.0      #         콘 명령 없이 이 시간 동안 서 있으면 M1 (콘 구간 안에서 넘어갈 수 있음)
    m8_force_exit_timeout_sec: 60.0   # [timeout] M8 에 들어온 뒤 이 시간이 지나면 무조건 M1 (콘 속도 0.10 m/s 면 구간 통과 약 30 s)

mission_traffic_light_node:
  ros__parameters:
    # 신호 색만 판단 (정지·출발은 매니저). traffic_light_logic.py
    # YOLO 라벨 두 방식을 모두 받음:
    #   (A) 색 클래스  'red'/'yellow'/'green'  -> 라벨 색을 HSV로 재확인
    #   (B) 몸체 클래스 'traffic_light'        -> 박스를 세로 3등분, 켜진 칸 위치로 색 판단
    #       (위=적, 가운데=황, 아래=녹). 광고 모니터에 덜 속아서 (B) 권장
    detections_topic: 'perception/detections'   # YOLO 모든 박스 (최고점 1개만 나오는 yolo_event 아님)
    image_topic: '/camera/color/image_raw/compressed'
    output_topic: 'mission/traffic_light_state' # red / yellow / green / unknown
    publish_rate_hz: 10.0
    image_max_age_sec: 0.3
    min_confidence: 0.45
    min_area_ratio: 0.0005            # 박스 면적/화면. 너무 작은(먼) 신호등 무시
    verify_hsv: true                  # 박스 안 불빛 색을 HSV로 다시 확인 (광고 모니터·오분류 거르기)
    # 아래 3개는 2026-11-15 실물 사진 14장으로 보정. LED 과노출로 채도가 많이 떨어지고
    # 함체 전체 박스 기준 켜진 비율이 0.004~0.029 로 작다
    min_lit_ratio: 0.002              # 박스 안 그 색 불빛 픽셀 비율 최소
    lit_value_min: 150
    lit_saturation_min: 30
    confirm_frames: 3                 # 같은 색 연속 N번이면 확정
    lost_timeout_sec: 1.0             # 신호등이 이 시간 안 보이면 unknown
    # (B) 몸체 클래스 전용
    housing_lamp_margin: 0.08         # 함체 위·아래 테두리로 보고 버릴 비율
    housing_min_lit_ratio: 0.003      # 한 칸이 '켜졌다'고 볼 최소 밝은 픽셀 비율
    housing_lit_dominance: 1.5        # 1등 칸이 2등 칸보다 이 배 이상 밝아야 인정
    # (A) 색 클래스를 함체 전체 박스로 학습한 경우에만 true 권장.
    # 라벨 색과 '켜진 칸 위치'가 맞는지까지 확인 -> 광고 모니터에 훨씬 강해짐.
    # 2026-11-15 실물 사진 14장에서는 켜도 14/14 정답. 트랙에서 모니터 오인식이 보이면 켤 것
    verify_lamp_position: false

