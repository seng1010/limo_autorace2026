    iou: 0.5
    image_size: 640
    max_rate_hz: 10.0
    confirm_frames: 3
    publish_debug: true
    traffic_roi: [0.0, 0.0, 1.0, 0.65]
    advertisement_exclusion_roi: [0.0, 0.65, 1.0, 1.0]

