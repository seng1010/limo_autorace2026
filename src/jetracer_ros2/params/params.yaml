data_collector_node:
  ros__parameters:
    section_id: 1
    save_dir: '/home/wego/third_impact/src/jetracer_ros2/jetracer_dataset'
    joy_steering_axis: 0
    deadman_button: 3
    max_steer_angle: 0.42
    left_steer_boost: 1.0
    linear_x: 0.25
    save_rate_hz: 10.0
    crop_ratio: 0.0

lane_following_node:
  ros__parameters:
    image_topic: '/camera/color/image_raw/compressed'
    camera_info_topic: '/camera/color/camera_info'
    output_topic: 'inference/cmd_vel'
    mode_topic: 'mission/lane_mode'
    use_camera_info: true
    publish_debug: true
    publish_commands: true         # 시작 시 적용. lane_debug launch는 false로 덮어씀
    live_debug_enabled: false      # NoMachine 데스크톱 GUI. 저장 기능 없음
    live_debug_fps: 5.0            # 화면 전달만 제한; 차선 계산 주기는 변경하지 않음
    command_timeout_sec: 0.30
    minimum_confidence: 0.48
    normal_speed: 0.40            # 유효 직선 차선에서만 적용; 곡선 진입 전 관측 여유 확보
    curve_speed: 0.30             # 곡선 검출 시; 유실 시 curve_recovery_speed
    curve_steering_speed_threshold: 0.35  # 조향 해제 중에는 곡선 속도 유지
    zigzag_speed: 0.18            # 노란 지그재그 우선 서행
    status_log_interval_sec: 1.0     # 선 종류 추정/confidence/명령 로그 주기. 0=끄기
    timing_log_enabled: false         # 실차 구간별 지연/입력 나이/최종 명령 계측 (매 프레임 INFO)
    max_steer_angle: 0.47123889803846897  # 27 deg; below limo_base 28 deg clamp
    ackermann_wheelbase_m: 0.20    # LIMO Pro 공식 휠베이스; limo_base와 대조
    ackermann_track_m: 0.172       # 현재 limo_base 역변환 코드의 값과 일치시킬 것
    curve_shape_min_span: 0.20       # 관측선 접선 방향 변화(rad). 위치/기울기 오차와 별개
    steering_attack_rate: 4.0        # 초당 조향 증가량(약 0.25초에 0→최대)
    steering_release_rate: 1.2       # 초당 같은 방향 조향 해제량(약 0.83초에 최대→0)
    steering_reversal_rate: 4.0      # S자 등 목표 부호 반전 시 빠른 방향 전환
    heading_hold_decay: 0.98
    heading_hold_max_sec: 0.50      # HEADING_HOLD 이벤트는 yaw 제어가 아니라 마지막 조향 유지; 무효 차선에서 0.5초 후 정지
    invalid_hold_sec: 0.25            # 차선 놓쳤을 때 마지막 명령 유지 시간 [s]
    curve_recovery_sec: 0.50         # 신뢰도 0.70 이상 확인된 곡선 유실만 연결, 최대 0.8초
    curve_recovery_speed: 0.12       # 곡선 유실 시 마지막 조향 유지, 최대 0.12 m/s
    odom_recovery_enabled: true      # 유효/신선한 /odom 경로가 있을 때만 우선 복구; 없으면 짧은 카메라 유실 유지
    odom_topic: '/odom'
    odom_max_age_sec: 0.20           # 갱신이 끊긴 오도메트리로는 복구하지 않음
    odom_max_speed_m_s: 1.0         # 순간 위치 점프/비현실적 변위 거부
    odom_max_yaw_rate_rad_s: 3.0     # 비현실적 방위 점프 거부
    odom_recovery_max_distance_m: 0.06 # 잔여 경로 절반과 이 절대 거리 중 먼저 도달하면 정지
    odom_recovery_min_forward_m: 0.15 # 후축 앞에 남은 경로점이 없으면 정지
    inner_curve_recovery_enabled: false # 우곡선 외측선 유실 시 우측 실선·여유를 재확인한 경우만 저속 복구
    curve_nearest_max_forward_m: 1.05 # 노란 우곡선의 관측 최근접점을 쓸 수 있는 후축 기준 최대 거리
    curve_left_near_max_forward_m: 1.05 # 우곡선 왼쪽선 아래 2~3번째 창 목표의 후축 기준 상한
    curve_lane_width_m: 0.52        # 사용자 실측 노란선 간 폭. 바깥선의 법선 방향으로 중심경로 생성
    curve_right_min_clearance_m: 0.13 # 중심 목표~오른쪽 선 최소 여유(차체 폭 실측 전 임시값)
    curve_left_preview_gain: 0.50     # 왼쪽선 위 2~3번째 창의 선행 우조향 비율
    curve_left_preview_max_rad: 0.16  # 선행 우조향 추가량 상한
    right_curve_min_steer_rad: 0.10  # 연속 확인된 우곡선의 최소 우조향; 직선/좌회전에는 미적용
    right_curve_floor_enabled: true  # false: PP가 요구하는 반대방향 복귀 조향도 보존
    curve_preview_enabled: true      # 추가 우조향 Preview 독립 비교 스위치
    right_curve_span_gain: 0.20      # 관측 곡률 span에 따른 추가 조향, max_steer_angle 이내
    right_curve_confirm_frames: 2   # 단발 노이즈에는 강제 우조향하지 않음
    reset_after_invalid_frames: 5     # 연속 N프레임 실패 시 이전 차선 기준 초기화
    zigzag_confirm_sec: 2.0          # 이 시간 이상 누적 검출되면 확정 구간
    zigzag_gap_sec: 0.35             # 짧은 미검출은 같은 구간으로 간주
    zigzag_hold_sec: 1.5            # 확정 구간 종료 뒤 추가 서행
    image_width: 640
    image_height: 480
    bev_src: [0.3605, 0.46, 0.6395, 0.46, 1.00, 0.82, 0.00, 0.82]
    # 영상 추정 보정(2026-11-13): TL,TR,BR,BL. 소실선 y≈154/480, 수평 가정.
    # 원본 y=46~82%의 바닥 사용. 실측 거리/렌즈 보정은 아님; 카메라 자세 변경 시 재검증.
    bev_dst: [0.22, 0.00, 0.78, 0.00, 0.78, 1.00, 0.22, 1.00]
    detect_white: true                # 흰 점선도 추적/분류. 흰 표식 오검출 시 false로 복귀
    white_lightness_min: 170
    white_saturation_max: 100
    detect_yellow: true               # 노란 차선 검출
    yellow_curve_priority: true       # 노란 실선 곡선이면 흰 외곽선보다 우선 추적
    observed_outer_curve_entry_enabled: false  # 실차 검증 전 기본 OFF; 왼쪽 직선 관측 시 우곡선 진입 허용
    yellow_curve_min_span: 0.20       # 관측 노란선의 접선 변화(rad)
    yellow_hue_min: 15                # HLS hue (0~180)
    yellow_hue_max: 35
    yellow_saturation_min: 80
    yellow_lightness_min: 60
    gradient_min: 35
    gradient_require_color_support: true  # gradient는 차선 색상 주변 보강에만 사용
    gradient_support_dilation: 9
    morphology_kernel: 3
    windows: 10
    window_margin: 55
    opposite_window_margin: 30       # 기준선 반대편은 예상 위치 주변만 검색
    search_opposite_in_single_mode: false  # left/right 모드는 기준선 하나만 실제 추적
    histogram_min_peak: 12           # 빈 영상 절반의 임의 argmax 방지
    bottom_tracking_windows: 3       # 하단과 연결되지 않은 상단 표식 거부
    recenter_min_pixels: 35
    fit_min_points: 120
    polynomial_degree: 3
    ransac_iterations: 60
    ransac_residual_px: 7.0
    lane_width_px: 370.0           # 새 BEV에서 직선 경계 간격 추정(픽셀)
    lane_width_tolerance: 0.35
    max_lane_width_change_px: 70.0
    max_fit_jump_px: 90.0
    strong_single_inlier_ratio: 0.65     # 강한 한쪽 선은 이전 중심 급변 검사보다 우선
    strong_single_point_multiplier: 1.5
    lookahead_y_ratio: 0.92        # 기존 목표의 원본 영상 y≈73.5% 유지
    preview_y_ratio: 0.76          # 기존 미리보기의 원본 영상 y≈62.9% 유지
    low_light_enabled: true
    low_light_max_gain: 3.0          # 색상 유지 밝기 증폭 상한. 검은 영역은 제외
    # 네 ROI 모서리의 실측 추정값. 실제 주행 전 명령 없는 디버거에서 확인한다.
    metric_lookahead_enabled: true    # 기본은 실측 지면 좌표+아커만; 비교 시 metric_ackermann:=false
    lookahead_distance_m: 0.65        # 직선 관측 시작 약 0.80m에서도 안전 검사 통과; 실차 재검증 필요
    camera_forward_offset_m: 0.184  # 공식 LIMO ROS2 URDF 명목값(0.100+0.084m); LIMO Pro 실차에서 확인
    metric_lateral_scale_m: 0.30    # 횡오차 정규화 거리, 실제 트랙에 맞춰 보정
    bev_ground_points_m: [-0.24, 1.326, 0.24, 1.326, 0.22, 0.421, -0.22, 0.421]
    # bev_src TL,TR,BR,BL 각각의 [오른쪽 m, 카메라 투영점에서 전방 m].
    # 사용자 실측: 뒤 차축 기준 앞 1.51/0.605m, 좌우 0.24/0.22m; 전방에서 0.184m 차감.
    metric_max_near_clamp_m: 0.30     # 정중앙 합성 직선의 최근접 관측 0.679m - 요청 0.40m를 포함
    metric_edge_margin_m: 0.02        # 마지막 관측 픽셀 자체 대신 2cm 안쪽의 목표 사용
    target_roi_margin_px: 20.0       # 목표점이 실측 BEV 영역을 크게 벗어나면 주행 불가
    smoothing_alpha: 0.35
    zigzag_min_step_px: 8.0
    zigzag_min_span_px: 55.0
    zigzag_min_direction_changes: 1
    duplicate_overlap_ratio: 0.30
    duplicate_gap_ratio: 0.50

stop_line_node:
  ros__parameters:
    image_topic: '/camera/color/image_raw/compressed'
    roi_top_ratio: 0.58
    white_lightness_min: 180
    white_saturation_max: 90
    horizontal_kernel_ratio: 0.12
    minimum_width_ratio: 0.42
    minimum_area_ratio: 0.018
    distance_scale_m: 1.6
    publish_debug: true

yolo_detection_node:
  ros__parameters:
    image_topic: '/camera/color/image_raw/compressed'
    model_path: ''  # e.g. /home/wego/models/autorace.engine
    confidence: 0.45
    iou: 0.5
    image_size: 640
    max_rate_hz: 10.0
    confirm_frames: 3
    publish_debug: true
    traffic_roi: [0.0, 0.0, 1.0, 0.65]
    advertisement_exclusion_roi: [0.0, 0.65, 1.0, 1.0]

mission_manager_node:
  ros__parameters:
    lane_command_topic: 'inference/cmd_vel'
    cone_command_topic: 'mission/cone/cmd_vel'
    parking_command_topic: 'mission/parking/cmd_vel'
    output_topic: '/cmd_vel'
    mission_event_topic: 'mission/event'
    active_mission_topic: 'mission/active'
    lane_mode_topic: 'mission/lane_mode'
    normal_speed: 0.70              # lane 노드 직선 속도를 상위에서 제한하지 않음
    slow_speed: 0.18                # 서행 표지 등 미션 속도 상한
    command_timeout_sec: 0.40
    stop_line_distance_m: 0.35
    pedestrian_hold_sec: 1.0
    auto_start_mission_nodes: true

mission_traffic_light_node:
  ros__parameters:
    yolo_event_topic: 'mission/yolo_event'
    stop_line_topic: 'mission/stop_line_distance'
    output_topic: 'mission/traffic_light_state'
    stop_distance_m: 0.35
    require_stop_line: true
    confirm_events: 2

mission_obstacle_avoid_node:
  ros__parameters:
    scan_topic: '/scan'
    front_angle_deg: 24.0
    side_angle_min_deg: 20.0
    side_angle_max_deg: 75.0
    obstacle_distance_m: 1.15
    clearance_distance_m: 1.4
    minimum_points: 4
    confirm_scans: 3

mission_cone_avoid_node:
  ros__parameters:
    scan_topic: '/scan'
    output_topic: 'mission/cone/cmd_vel'
    speed: 0.10
    max_steer_angle: 0.42
    lookahead_m: 1.0
    field_of_view_deg: 80.0
    maximum_cone_range_m: 2.5
    minimum_points_each_side: 2
    steering_gain: 1.3
    emergency_distance_m: 0.25

mission_parking_node:
  ros__parameters:
    output_topic: 'mission/parking/cmd_vel'
    search_speed: 0.08
    reverse_speed: -0.07
    max_steer_angle: 0.40
    opening_distance_m: 1.0
    opening_confirm_scans: 4
    advance_distance_m: 0.42
    reverse_turn_yaw_deg: 72.0
    reverse_straight_distance_m: 0.48
    rear_stop_distance_m: 0.22
    right_sector_deg: [-100.0, -55.0]

debug_autorace_node:
  ros__parameters:
    frame_id: 'base_link'
